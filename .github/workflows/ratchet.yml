name: Ratchet
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ratchet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ratchet:
    name: ratchet
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          bun --version
      - name: Harness safety and comment validation
        run: python3 -m unittest discover -s ratchet -p 'test_*.py'
      - name: Cache identity
        id: identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HARNESS_HASH: ${{ hashFiles('ratchet/**', '.github/workflows/ratchet.yml') }}
        run: |
          tools=$( { sw_vers; xcodebuild -version; swift --version; bun --version; python3 --version; printf '%s' "$ImageOS-$ImageVersion"; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=ratchet-base-$BASE_SHA-$HARNESS_HASH-$tools" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .verified/ratchet/cache
          key: ${{ steps.identity.outputs.key }}
      - name: Main baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 ratchet/base_cache.py --ref "$BASE_SHA" --cached .verified/ratchet/cache --output .verified/ratchet/baseline
      - name: Stage clean baseline
        if: ${{ success() && hashFiles('.verified/ratchet/baseline/cacheable') != '' }}
        run: |
          mkdir -p .verified/ratchet/cache
          cp .verified/ratchet/baseline/result.json .verified/ratchet/cache/result.json
      - uses: actions/cache/save@v4
        if: ${{ success() && hashFiles('.verified/ratchet/baseline/cacheable') != '' }}
        with:
          path: .verified/ratchet/cache
          key: ${{ steps.identity.outputs.key }}
      - name: PR head
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ratchet/run.py --ref "$HEAD_SHA" --output .verified/ratchet/head
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ratchet
          path: .verified/ratchet/
          include-hidden-files: true
          if-no-files-found: error
