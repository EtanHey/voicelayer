name: Ratchet comment
on:
  workflow_run:
    workflows: [Ratchet]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      # Only trusted default-branch code executes with the comment token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: ratchet
          path: .verified/ratchet
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/github-script@v7
        id: context
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.event !== 'pull_request') throw new Error('Not a PR run');
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo, commit_sha: run.head_sha
            });
            const pr = prs.find(p => p.state === 'open' && p.base.ref === 'main' && p.head.sha === run.head_sha);
            if (!pr) throw new Error('No current matching PR; refusing stale comment');
            core.setOutput('pr', pr.number);
            core.setOutput('base', pr.base.sha);
            core.setOutput('head', pr.head.sha);
      - name: Upsert pinned table
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.context.outputs.pr }}
          BASE_SHA: ${{ steps.context.outputs.base }}
          HEAD_SHA: ${{ steps.context.outputs.head }}
          REPO: ${{ github.repository }}
        run: |
          python3 ratchet/comment.py --baseline .verified/ratchet/baseline/result.json \
            --head .verified/ratchet/head/result.json --baseline-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" --pr "$PR" --repo "$REPO"
