name: Publish to npm

on:
  push:
    tags: ['v*']
  # Lets us re-publish an existing tag with the CURRENT workflow file. A plain
  # `gh run rerun` replays the workflow as it existed AT THE TAG, so a fix to
  # this file never reaches the rerun — which is what hid the v2.2.11 OIDC
  # failure. Dispatching from main and checking out `ref` separates the two.
  workflow_dispatch:
    inputs:
      ref:
        description: 'tag to publish, e.g. v2.2.11'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    # Repeated from the top level deliberately: a job-level `permissions` block
    # replaces (not merges with) the workflow default, so anything added here
    # later would silently drop `id-token: write` and break OIDC.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: source

      # Older requested tags need the guard from this immutable workflow revision.
      # Keep tooling beside the package so it cannot enter the selected archive.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-tools

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No registry-url: that makes setup-node write a token-based .npmrc
      # (always-auth + empty NODE_AUTH_TOKEN) which overrides OIDC and 404s.
      # OIDC Trusted Publishing needs npm to see NO _authToken so it exchanges
      # the GitHub OIDC token for a short-lived publish token itself.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install replay audio test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - run: bun install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install daemon test dependencies
        run: python3 -m pip install -r ../workflow-tools/tests/requirements-tts-daemon.txt

      - name: Run tests
        run: bun test

      - name: Type check
        run: bun run typecheck

      # npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
      # Requires npm >= 11.5.1 and a Trusted Publisher configured for
      # `voicelayer-mcp` on npmjs.com (repo: EtanHey/voicelayer,
      # workflow: .github/workflows/publish.yml). `id-token: write` (above)
      # supplies the OIDC token; provenance is attested automatically.
      - name: Pin npm (OIDC trusted publishing support)
        run: |
          # npm 12's packlist excludes bun.lock even when files[] includes it.
          npm install -g npm@11.19.1
          npm --version
          test "$(npm --version)" = 11.19.1

      - name: Test package contract tooling
        working-directory: workflow-tools
        run: python3 -m unittest discover -s tests -p npm_package_contract_test.py -v

      - name: Verify packed package contract
        run: |
          release_commit=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$release_commit" != "$GITHUB_SHA" ]; then
              echo "release commit mismatch: expected GITHUB_SHA $GITHUB_SHA, actual checkout HEAD $release_commit" >&2
              exit 1
            fi
          fi
          export GITHUB_SHA="$release_commit"
          python3 ../workflow-tools/scripts/release-commit-stamp.py stamp --source "$PWD"
          pack_dir=$(mktemp -d "$RUNNER_TEMP/voicelayer-pack.XXXXXX")
          npm pack --pack-destination "$pack_dir"
          archive="voicelayer-mcp-$(node -p 'require("./package.json").version').tgz"
          python3 ../workflow-tools/scripts/verify-npm-package.py "$pack_dir/$archive" --source "$PWD"
          python3 ../workflow-tools/scripts/release-commit-stamp.py verify --archive "$pack_dir/$archive"
          echo "pack_archive=$pack_dir/$archive" >> "$GITHUB_ENV"

      - name: Publish (OIDC trusted publishing)
        # Verbose so the OIDC token exchange is visible. A default-loglevel run
        # reports only `ENEEDAUTH`, which does not say whether npm skipped the
        # exchange, was refused by the registry, or matched no trusted publisher.
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish "$pack_archive" --provenance --access public
