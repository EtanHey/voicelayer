name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Type check
        run: bun run typecheck

      # npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
      # Requires npm >= 11.5.1 and a Trusted Publisher configured for
      # `voicelayer-mcp` on npmjs.com (repo: EtanHey/voicelayer,
      # workflow: .github/workflows/publish.yml). `id-token: write` (above)
      # supplies the OIDC token; provenance is attested automatically.
      - name: Upgrade npm (OIDC trusted publishing support)
        run: npm install -g npm@latest

      - name: Publish (OIDC trusted publishing)
        run: npm publish --provenance --access public
