name: Daemon Verification Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  daemon-verification-gate:
    name: daemon-verification-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signed runtime verification proof
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNTIME_SIGNER: ${{ vars.VOICELAYER_RUNTIME_SIGNER }}
        run: |
          set -euo pipefail

          if [ -z "$RUNTIME_SIGNER" ]; then
            echo "Repository variable VOICELAYER_RUNTIME_SIGNER is not configured." >&2
            exit 2
          fi
          case "$RUNTIME_SIGNER" in
            *$'\n'*|*$'\r'*)
              echo "VOICELAYER_RUNTIME_SIGNER must contain exactly one public-key line." >&2
              exit 2
              ;;
            ssh-*|ecdsa-*|sk-*) ;;
            *)
              echo "VOICELAYER_RUNTIME_SIGNER is not an SSH public key." >&2
              exit 2
              ;;
          esac

          allowed_signers="$(mktemp)"
          predicate="$(mktemp)"
          trap 'rm -f "$allowed_signers" "$predicate"' EXIT INT TERM
          printf '* %s\n' "$RUNTIME_SIGNER" > "$allowed_signers"

          if git show "$BASE_SHA:scripts/check-daemon-verification-proof.sh" > "$predicate" 2>/dev/null; then
            echo "Using daemon proof predicate from immutable base sha $BASE_SHA."
          elif [ "$BASE_SHA" = "5396e4cfb87b9e0d715af9fc9dd39cb2d1ae5284" ]; then
            echo "Bootstrapping the daemon proof predicate on its one approved pre-gate base sha."
            cp scripts/check-daemon-verification-proof.sh "$predicate"
          else
            echo "The immutable base sha does not contain the daemon proof predicate." >&2
            exit 2
          fi

          tag_ref="refs/tags/runtime-verified/$HEAD_SHA"
          if git ls-remote --exit-code origin "$tag_ref" >/dev/null 2>&1; then
            git fetch --no-tags origin "$tag_ref:$tag_ref"
          fi

          bash "$predicate" \
            "$BASE_SHA" "$HEAD_SHA" "$allowed_signers"
