name: Daemon Verification Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  daemon-verification-gate:
    name: daemon-verification-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signed runtime verification proof
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNTIME_SIGNER: ${{ vars.VOICELAYER_RUNTIME_SIGNER }}
          BOOTSTRAP_PREDICATE_SHA256: ${{ vars.VOICELAYER_DAEMON_PROOF_PREDICATE_SHA256 }}
        run: |
          set -euo pipefail

          allowed_signers="$(mktemp)"
          predicate="$(mktemp)"
          trap 'rm -f "$allowed_signers" "$predicate"' EXIT INT TERM
          printf '* %s\n' "$RUNTIME_SIGNER" > "$allowed_signers"

          if git show "$BASE_SHA:scripts/check-daemon-verification-proof.sh" > "$predicate" 2>/dev/null; then
            echo "Using daemon proof predicate from immutable base sha $BASE_SHA."
          elif [ "$BASE_SHA" = "d292366078594e900f9e3f4201297a104e650e47" ]; then
            echo "Bootstrapping the daemon proof predicate on its one approved pre-gate base sha."
            cp scripts/check-daemon-verification-proof.sh "$predicate"
            if ! [[ "$BOOTSTRAP_PREDICATE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Repository variable VOICELAYER_DAEMON_PROOF_PREDICATE_SHA256 is not configured with a lowercase SHA-256 digest." >&2
              exit 2
            fi
            if ! printf '%s  %s\n' "$BOOTSTRAP_PREDICATE_SHA256" "$predicate" |
              sha256sum -c - >/dev/null 2>&1; then
              echo "The bootstrap daemon proof predicate does not match the externally trusted digest." >&2
              exit 2
            fi
          else
            echo "The immutable base sha does not contain the daemon proof predicate." >&2
            exit 2
          fi

          tag_ref="refs/tags/runtime-verified/$HEAD_SHA"
          if git ls-remote --exit-code origin "$tag_ref" >/dev/null 2>&1; then
            git fetch --no-tags origin "$tag_ref:$tag_ref"
          fi

          bash "$predicate" \
            "$BASE_SHA" "$HEAD_SHA" "$allowed_signers"
