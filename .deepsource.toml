version = 1

# Build output, generated artifacts, vendored deps, and non-code assets.
# DeepSource analyzes the whole checkout, so anything that is not
# hand-written product code belongs here.
exclude_patterns = [
  "**/node_modules/**",
  "dist/**",
  "site/.next/**",
  "site/out/**",
  "flow-bar/.build/**",
  "**/__pycache__/**",
  "models/**",
  "landing/**",
  "site/public/**",
  "docs.local/**",
  "openspec/**",
  "versa_cache/**",
]

test_patterns = [
  "tests/**",
  "src/__tests__/**",
  "flow-bar/Tests/**",
  "voice_coach/tests/**",
  "eval/test_*.py",
  "eval/conftest.py",
  "**/*.test.ts",
  "**/*.test.tsx",
]

# TypeScript: src/** (Node/bun MCP + daemon) and site/** (Next.js 16 + React 19).
[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  dialect = "typescript"
  module_system = "es-modules"
  environment = ["nodejs", "browser"]
  plugins = ["react"]

# Swift: flow-bar/ (VoiceBar menu-bar app), swift-tools-version 5.9.
[[analyzers]]
name = "swift"
enabled = true

  [analyzers.meta]
  swift_version = "5.9"

# Shell: scripts/**, launchd/**, .githooks/** — every script is bash.
[[analyzers]]
name = "shell"
enabled = true

  [analyzers.meta]
  dialect = "bash"

# Python: voice_coach/, eval/, src/tts_daemon.py, scripts/.
[[analyzers]]
name = "python"
enabled = true

  [analyzers.meta]
  runtime_version = "3.x.x"

[[analyzers]]
name = "secrets"
enabled = true
