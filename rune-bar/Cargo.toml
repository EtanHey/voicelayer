[workspace]
members = ["."]
resolver = "3"

[package]
name = "voicebar-rune"
default-run = "voicebar-rune"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
rust-version = "1.99.1"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd", features = ["tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Rune's root patches do not propagate to consuming workspaces. Mirror its pinned
# vendor patches (including macOS IME); never silently use registry substitutes.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "74a3c8d4f4aadbdadcc8fae0aee5e36f42af1ccd" }

[[bin]]
name = "trailing-band"
path = "spikes/virtual-rows-trailing-band/repro.rs"
